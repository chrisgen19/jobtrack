name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_test
  DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_test

jobs:
  checks:
    name: Typecheck, lint, unit + integration tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Migrations apply cleanly and match the schema
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  extension:
    name: Browser extension typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dev .env.example points at localhost, which is all a CI build needs.
      - run: cp extension/.env.example extension/.env
      - run: pnpm --filter @jobtrack/extension typecheck
      - run: pnpm --filter @jobtrack/extension test
      - run: pnpm ext:build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web, worker and migrate targets
        run: |
          for target in web worker migrate; do
            docker buildx build --target "$target" --tag "jobtrack-$target:ci" .
          done
