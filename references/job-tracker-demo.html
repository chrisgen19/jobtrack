function renderCalendar(){const y=state.calendarMonth.getFullYear(),m=state.calendarMonth.getMonth(),first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();const prevDays=new Date(y,m,0).getDate();const entries=[];for(let i=0;i<42;i++){let d=i-start+1,offset=0;if(d<1){d=prevDays+d;offset=-1}else if(d>days){d-=days;offset=1}const dt=new Date(y,m+offset,d),iso=dayISO(dt.getFullYear(),dt.getMonth(),d),is=state.interviews.filter(v=>v.date===iso&&v.status==='Scheduled'),ts=state.tasks.filter(v=>v.due===iso&&!v.completed);entries.push(`<button class="cal-day ${offset?'other':''} ${iso===TODAY?'today':''} ${iso===state.selectedDate?'selected':''}" data-select-date="${iso}" aria-label="${fullDate(iso)}"><span class="cal-number">${d}</span><div class="cal-dots">${is.slice(0,1).map(v=>`<span class="cal-event">${esc(getJob(v.jobId)?.company||'Interview')}</span>`).join('')}${ts.slice(0,1).map(v=>`<span class="cal-event task-event">Task due</span>`).join('')}${is.length+ts.length>2?'<span style="font-size:9px;color:#9eafa0">+'+(is.length+ts.length-2)+' more</span>':''}</div></button>`)}let dayInter=state.interviews.filter(i=>i.date===state.selectedDate&&i.status==='Scheduled').sort((a,b)=>a.time.localeCompare(b.time)),dayTasks=state.tasks.filter(t=>t.due===state.selectedDate&&!t.completed);return `${header('INTERVIEW & TASK SCHEDULE','Your calendar','A simple view of interviews, deadlines, and follow-ups.',`<button class="secondary-btn" data-action="new-interview">${ico('plus')} New interview</button>`)}<div class="cal-grid-container"><section class="panel calendar-card"><div class="calendar-toolbar"><h3>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><div class="filter-stack"><button class="icon-btn" aria-label="Previous month" data-action="prev-month">${ico('chev-left')}</button><button class="secondary-btn" data-action="today">Today</button><button class="icon-btn" aria-label="Next month" data-action="next-month">${ico('chev-right')}</button></div></div><div class="cal-header">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${entries.join('')}</div></section><aside class="panel cal-agenda"><div class="cal-agenda-header"><div><h3 class="panel-title">Daily agenda</h3><div class="calendar-selected-date">${fullDate(state.selectedDate)}</div></div><span class="stage-badge">${dayInter.length+dayTasks.length} events</span></div>${dayInter.map(i=>{const j=getJob(i.jobId);return `<div class="cal-details" data-job="${j?.id}"><div class="cal-time">${fmtTime(i.time)}</div><div><strong>${esc(i.type)}</strong><p>${esc(j?.company||'')} · ${esc(i.mode)}<br>${i.duration} minutes · ${esc(i.interviewer||'Interview')}</p></div></div>`}).join('')}${dayTasks.map(t=>`<div class="cal-details" data-job="${t.jobId}"><div class="cal-time" style="color:#ab8b4b">TASK</div><div><strong>${esc(t.title)}</strong><p>${esc(getJob(t.jobId)?.company||'')} · Follow-up</p></div></div>`).join('')}${!dayInter.length&&!dayTasks.length?`<div class="empty-state" style="padding:42px 10px"><div class="empty-graphic">${ico('calendar')}</div><strong>Nothing scheduled</strong><p>Enjoy a little breathing room or add an interview.</p></div>`:''}<div style="border-top:1px solid #eef1ed;padding-top:20px;margin-top:14px"><div class="section-label" style="margin:0 0 13px">COMING UP</div>${upcoming().slice(0,3).map(i=>`<div style="padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:7px;cursor:pointer" data-select-date="${i.date}"><span style="font-size:11px;color:#627a69">${esc(getJob(i.jobId)?.company||'')}</span><span style="font-size:10px;color:#9aa69d">${prettyDay(i.date)}</span></div>`).join('')}</div></aside></div>`}
function renderTasks(){let incomplete=state.tasks.filter(t=>!t.completed).sort((a,b)=>a.due.localeCompare(b.due));let done=state.tasks.filter(t=>t.completed);const groups=[['Overdue',incomplete.filter(t=>t.due<TODAY)],['Today',incomplete.filter(t=>t.due===TODAY)],['Upcoming',incomplete.filter(t=>t.due>TODAY)],['Completed',done]];return `${header('STAY ON TOP OF THINGS','Tasks & follow-ups','Small actions that keep your job search moving forward.',`<button class="secondary-btn" data-action="add-task">${ico('plus')} New task</button>`)}<div class="tasks-layout"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Your action list</h2><div class="panel-sub">${incomplete.length} remaining · ${done.length} completed</div></div><span class="stage-badge">${Math.round(100*done.length/(state.tasks.length||1))}% complete</span></div>${groups.map(([label,ts])=>ts.length?`<div class="task-group-title">${label} <span style="color:#bcc8be">· ${ts.length}</span></div>${ts.map(t=>taskRow(t,true)).join('')}`:'').join('')}</section><aside class="panel tips-panel"><div class="guide-icon" style="width:39px;height:39px;background:#edf7ef">${ico('sparkle','ic-lg')}</div><h3>Stay in motion.</h3><p>Job hunting is easier when you know exactly what to do next. A few minutes of planning can save hours of uncertainty.</p>${[['1','After applying','Create a follow-up for the following week.'],['2','Before an interview','Prepare questions, examples, and your meeting link.'],['3','After an interview','Write down what happened and set the next action.']].map(([n,t,p])=>`<div class="tip-item"><div class="tip-number">${n}</div><div><strong>${t}</strong><p>${p}</p></div></div>`).join('')}<button class="secondary-btn" style="width:100%;margin-top:26px" data-page="calendar">${ico('calendar')} Check your calendar</button></aside></div>`}
function renderAnalytics(){const stages=[['Applied',state.jobs.filter(j=>j.appliedAt).length],['Screening+',state.jobs.filter(j=>['screening','assessment','technical','final','offer'].includes(j.stage)).length],['Technical+',state.jobs.filter(j=>['technical','final','offer'].includes(j.stage)).length],['Final+',state.jobs.filter(j=>['final','offer'].includes(j.stage)).length],['Offers',state.jobs.filter(j=>j.stage==='offer').length]];const sources={};state.jobs.forEach(j=>sources[j.source]=(sources[j.source]||0)+1);const weeks=[3,5,4,7,6,9,8,11];return `${header('JOB SEARCH INSIGHTS','Your progress, in perspective','Understand what’s working and where the opportunities are.',`<button class="secondary-btn" data-action="export">${ico('download')} Export data</button>`)}<div class="metrics">${metric('briefcase','Applications sent',state.jobs.filter(j=>j.appliedAt).length,'Since you started tracking')}${metric('users','Interview-stage roles',stages[1][1],'<b>Progressed</b> beyond application','purple')}${metric('target','Offer conversion',Math.round(100*stages[4][1]/Math.max(1,stages[0][1]))+'%','Offers ÷ submitted applications','orange')}${metric('chart','Saved opportunities',state.jobs.filter(j=>j.stage==='saved').length,'Ready for your next move','blue')}</div><div class="analytics-grid"><section class="panel chart-card"><h2 class="panel-title">Application activity</h2><div class="panel-sub">Illustrative weekly trend · sample data</div><div class="chart-bars">${weeks.map((v,i)=>`<div class="chart-bar-col"><div class="chart-bar" style="height:${v/12*100}%" title="${v} applications"></div><span>W${i+1}</span></div>`).join('')}</div></section><section class="panel chart-card"><h2 class="panel-title">Application conversion</h2><div class="panel-sub">Applications reaching each milestone</div><div style="margin-top:25px">${stages.map(([n,v])=>`<div class="funnel-row"><span class="name">${n}</span><div class="funnel-bg"><div class="funnel-fill" style="width:${v/Math.max(1,stages[0][1])*100}%"></div></div><strong>${v}</strong></div>`).join('')}</div></section><section class="panel chart-card" style="min-height:250px"><h2 class="panel-title">Where you found jobs</h2><div class="panel-sub">Application sources</div><table class="source-table">${Object.entries(sources).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td style="text-align:right"><b>${v}</b> opportunities</td></tr>`).join('')}</table></section><section class="panel chart-card" style="min-height:250px"><h2 class="panel-title">A note about your numbers</h2><p style="font-size:12px;color:#88968b;line-height:1.8;margin-top:20px">Great job tracking the details. Application data is most useful when you also capture <b style="color:#506c56">why</b> each opportunity moved forward or ended.</p><div class="notice">Demo analytics are illustrative, not live employment-market benchmarks. Conversion metrics are calculated from the sample applications on this page.</div></section></div>`}
function renderDocuments(){return `${header('APPLICATION MATERIALS','Your document library','Keep resumes and cover letters organized by application.',`<button class="secondary-btn" data-action="upload-doc">${ico('upload')} Add document</button>`)}<div class="demo-banner">${ico('attach','ic-sm')} <span><strong>Local preview:</strong> adding a document records its name in this demo; no file is uploaded or stored on a server.</span></div><div class="document-grid">${state.docs.map(d=>`<article class="panel document-card"><div class="document-icon ${d.type==='Cover Letter'?'cover':''}">${ico('file','ic-xl')}</div><div><h3>${esc(d.name)}</h3><p>${esc(d.type)} · ${esc(d.size)} · Added ${prettyDay(d.date)}</p></div><div class="document-footer"><span>Used in ${d.used.length} application${d.used.length===1?'':'s'}</span><button class="subtle-link" data-action="document-info" data-doc-id="${d.id}">Details ${ico('arrow','ic-xs')}</button></div></article>`).join('')}<button style="display:flex;align-items:center;justify-content:center;gap:9px;border:1.5px dashed #d3e4d7;border-radius:15px;background:#f5f9f5;color:#6a9477;font-weight:750;font-size:12px;min-height:209px" data-action="upload-doc">${ico('plus')} Add a document</button></div>`}
function renderSettings(){return `${header('MAKE IT YOURS','Workspace settings','Customize how JobTrack supports your search.')}<div class="settings-layout"><section class="panel settings-card"><h3>Hiring pipeline</h3><p>Create stages that match how companies actually interview. You can rename or reorder stages at any time.</p><div class="settings-row"><div><strong>Custom application stages</strong><span>${state.stages.length} stages configured</span></div><button class="secondary-btn" data-action="manage-stages">${ico('sliders')} Edit stages</button></div><div style="margin-top:12px">${state.stages.map(s=>`<div style="display:flex;align-items:center;gap:9px;padding:7px 0;font-size:11px;color:#768b7c"><span class="kanban-dot" style="background:${s.color}"></span>${esc(s.name)}<span style="margin-left:auto;color:#b0bcb2">${state.jobs.filter(j=>j.stage===s.id).length} jobs</span></div>`).join('')}</div></section><section class="panel settings-card"><h3>Reminders & notifications</h3><p>Choose how you'd like to receive updates and keep your schedule organized.</p>${[['inapp','In-app notifications','Alerts inside your JobTrack workspace'],['email','Email reminders','Preview setting · no emails are sent'],['calendar','Calendar reminders','Preview setting · requires integration']].map(([id,label,sub])=>`<div class="settings-row"><div><strong>${label}</strong><span>${sub}</span></div><button class="toggle ${state.notifications[id]?'on':''}" aria-label="Toggle ${label}" aria-pressed="${state.notifications[id]}" data-toggle-notification="${id}"></button></div>`).join('')}</section><section class="panel settings-card"><h3>Connected calendars</h3><p>Connect your calendar to keep interviews and reminders alongside the rest of your schedule.</p><div class="integration-card"><div class="integration-logo">${ico('calendar','ic-lg')}</div><div><strong>Google Calendar</strong><small>${state.calendarConnected?'Simulated connection · demo only':'Not connected'}</small></div><button class="secondary-btn" data-action="connect-calendar">${state.calendarConnected?'Disconnect':'Connect'}</button></div><div class="notice" style="margin-top:16px">This prototype simulates connection status only. Real Google OAuth and event syncing will be implemented in the production application.</div></section><section class="panel settings-card"><h3>Account & data</h3><p>In the production app, each user gets a private workspace, secure files, and account-specific reminders.</p><div class="settings-row"><div><strong>Demo workspace</strong><span>Preview account · no authentication required</span></div><span class="stage-badge">Demo</span></div><div class="settings-row"><div><strong>Export your job data</strong><span>Download your currently displayed demo jobs</span></div><button class="secondary-btn" data-action="export">${ico('download')} CSV</button></div><div class="notice" style="margin-top:14px">No account, database, cloud storage, or email service is connected to this design preview.</div></section></div>`}
function renderDrawer(){if(!state.drawer)return '';const j=getJob(state.drawer);if(!j)return '';const tabs=[['overview','Overview'],['timeline','Timeline'],['interviews','Interviews'],['documents','Documents']];const relatedInter=state.interviews.filter(i=>i.jobId===j.id).sort((a,b)=>b.date.localeCompare(a.date));const relatedTasks=state.tasks.filter(t=>t.jobId===j.id);const relatedDocs=state.docs.filter(d=>d.used.includes(j.id));return `<div class="overlay" data-action="close-drawer"></div><aside class="drawer" aria-modal="true" role="dialog" aria-label="Job details"><div class="drawer-top"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:23px"><span style="font-size:11px;font-weight:760;color:#95a49a;letter-spacing:.8px">APPLICATION DETAILS</span><div class="filter-stack"><button class="icon-btn" title="Edit job" data-action="edit-job" data-id="${j.id}">${ico('edit')}</button><button class="icon-btn" aria-label="Close details" data-action="close-drawer">${ico('x')}</button></div></div><div style="display:flex;gap:14px;align-items:center">${renderLogo(j)}<div><h2 style="margin:0;font-size:21px;letter-spacing:-.8px;line-height:1.25">${esc(j.role)}</h2><p style="margin:6px 0 0;color:#8e9d92;font-size:12px">${esc(j.company)} · ${esc(j.location)}</p></div></div><div style="display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap"><select class="field-select" id="drawer-stage" style="max-width:none;border-color:#c8dccc;background:#f3faf3;color:#2e7651;font-weight:760">${state.stages.map(s=>`<option value="${s.id}" ${s.id===j.stage?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select class="field-select" id="drawer-priority"><option value="high" ${j.priority==='high'?'selected':''}>High priority</option><option value="medium" ${j.priority==='medium'?'selected':''}>Medium priority</option><option value="low" ${j.priority==='low'?'selected':''}>Low priority</option></select></div></div><div class="drawer-content"><div class="drawer-tabs">${tabs.map(([id,name])=>`<button class="drawer-tab ${state.drawerTab===id?'active':''}" data-drawer-tab="${id}">${name}</button>`).join('')}</div>${state.drawerTab==='overview'?`<div class="detail-info-grid"><div class="detail-fact"><span>SALARY RANGE</span><strong>${esc(money(j))}</strong></div><div class="detail-fact"><span>WORK ARRANGEMENT</span><strong>${esc(j.work)}</strong></div><div class="detail-fact"><span>DATE APPLIED</span><strong>${j.appliedAt?prettyDate(j.appliedAt):'Not applied yet'}</strong></div><div class="detail-fact"><span>JOB SOURCE</span><strong>${esc(j.source)}</strong></div></div><div class="section-label">ABOUT THIS ROLE</div><p class="text-description">${esc(j.description)}</p><div class="section-label">TECHNOLOGIES</div><div class="tag-row">${j.tags.map(t=>`<span class="tiny-tag">${esc(t)}</span>`).join('')}</div><div class="section-label">YOUR NOTES</div><p class="text-description" style="background:#f8faf7;border-radius:10px;padding:13px">${esc(j.notes||'No notes yet. Click Edit to add your thoughts.')}</p>${j.outcome?`<div class="section-label">OUTCOME</div><span class="stage-badge stage-closed">${esc(j.outcome)}</span>`:''}<div class="section-label">NEXT STEPS</div>${relatedTasks.filter(t=>!t.completed).map(t=>taskRow(t)).join('')||'<div class="notice">No open tasks for this application.</div>'}<button class="secondary-btn" style="margin-top:18px" data-action="add-task" data-for-job="${j.id}">${ico('plus')} Add follow-up</button>`:state.drawerTab==='timeline'?`<div class="section-label">APPLICATION HISTORY</div><div class="timeline">${[...relatedInter.map(i=>({date:i.date,title:i.type,detail:`${i.status} · ${i.mode}`})),...(j.appliedAt?[{date:j.appliedAt,title:'Application submitted',detail:`Applied via ${j.source}`}]:[]),...relatedTasks.filter(t=>t.completed).map(t=>({date:t.due,title:t.title,detail:'Task completed'}))].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="timeline-event"><strong>${esc(e.title)}</strong><span>${prettyDate(e.date)} · ${esc(e.detail)}</span></div>`).join('')||'<p>No activity yet</p>'}</div>`:state.drawerTab==='interviews'?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:17px"><strong style="font-size:13px">${relatedInter.length} interview rounds</strong><button class="secondary-btn" data-action="new-interview" data-for-job="${j.id}">${ico('plus')} Schedule interview</button></div>${relatedInter.map(i=>`<div class="interview-card"><div class="interview-card-head"><strong>${esc(i.type)}</strong><span class="stage-badge ${i.status==='Completed'?'stage-saved':''}">${esc(i.status)}</span></div><small>${prettyDate(i.date)} at ${fmtTime(i.time)} · ${i.duration} min</small><p>${ico('video','ic-xs')} ${esc(i.mode)}<br>${ico('users','ic-xs')} ${esc(i.interviewer||'Interview team')}</p></div>`).join('')||'<div class="notice">No interviews scheduled for this role.</div>'}`:`<div class="section-label">ATTACHED DOCUMENTS</div>${relatedDocs.map(d=>`<div class="interview-card" style="display:flex;align-items:center;gap:11px"><div class="document-icon" style="width:36px;height:36px">${ico('file','ic-sm')}</div><div><strong>${esc(d.name)}</strong><p style="margin:3px 0 0">${esc(d.type)} · ${esc(d.size)}</p></div></div>`).join('')||'<div class="notice">No documents assigned. You can manage documents in the library.</div>'}<button class="secondary-btn" style="margin-top:14px" data-page="documents">${ico('file')} Open document library</button>`}</div></aside>`}

function renderModal(){if(!state.modal)return '';const m=state.modal;let content='';if(m.type==='add-job'||m.type==='edit-job'){const j=m.type==='edit-job'?getJob(m.id):null;content=`<form id="job-form">${modalHeader(j?'Edit opportunity':'Add a new opportunity',j?'Update the details for this job.':'Save a job in seconds. You can fill out the rest later.')}<div class="modal-body"><div class="form-grid">${formField('Job title *','role',j?.role,'required placeholder="e.g. Full-Stack Developer"')}${formField('Company *','company',j?.company,'required placeholder="e.g. Acme Studio"')}${formField('Minimum salary','min',j?.min||'','type="number" min="0" placeholder="120000"')}${formField('Maximum salary','max',j?.max||'','type="number" min="0" placeholder="150000"')}<div class="form-field"><label>Currency</label><select name="currency">${['PHP','AUD','USD'].map(v=>`<option value="${v}" ${(j?.currency||'PHP')===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-field"><label>Salary period</label><select name="unit"><option value="month" ${(j?.unit||'month')==='month'?'selected':''}>Per month</option><option value="year" ${j?.unit==='year'?'selected':''}>Per year</option></select></div><div class="form-field"><label>Hiring stage</label><select name="stage">${state.stages.map(s=>`<option value="${s.id}" ${(j?.stage||m.stage||'saved')===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="form-field"><label>Priority</label><select name="priority">${['high','medium','low'].map(p=>`<option value="${p}" ${(j?.priority||'medium')===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></div><div class="form-field"><label>Work arrangement</label><select name="work">${['Remote','Hybrid','Onsite'].map(v=>`<option ${j?.work===v?'selected':''}>${v}</option>`).join('')}</select></div>${formField('Location','location',j?.location||'','placeholder="e.g. Manila, PH"')}${formField('Date applied','appliedAt',j?.appliedAt||'','type="date"')}<div class="form-field"><label>Job source</label><select name="source">${['LinkedIn','JobStreet','Company site','Referral','RemoteOK','Other'].map(v=>`<option ${j?.source===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-field full"><label>Job description</label><textarea name="description" placeholder="Paste the job description here...">${esc(j?.description||'')}</textarea></div><div class="form-field full"><label>Personal notes</label><textarea name="notes" style="min-height:60px" placeholder="What makes this opportunity interesting?">${esc(j?.notes||'')}</textarea></div></div></div><div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">${ico('check')} ${j?'Save changes':'Save job'}</button></div></form>`}else if(m.type==='add-task'){content=`<form id="task-form">${modalHeader('Create a task','Keep the next step visible and actionable.')}<div class="modal-body"><div class="form-grid"><div class="form-field full"><label>Task title *</label><input name="title" required placeholder="e.g. Follow up after technical interview" /></div><div class="form-field"><label>Due date *</label><input name="due" type="date" required value="${TODAY}" /></div><div class="form-field"><label>Type</label><select name="category">${['Follow-up','Interview prep','Application','Assessment','Offer','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field full"><label>Related opportunity</label><select name="jobId"><option value="">General task</option>${state.jobs.map(j=>`<option value="${j.id}" ${m.jobId===j.id?'selected':''}>${esc(j.role)} · ${esc(j.company)}</option>`).join('')}</select></div></div></div><div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">Add task</button></div></form>`}else if(m.type==='new-interview'){content=`<form id="interview-form">${modalHeader('Schedule an interview','Create as many interview rounds as you need.')}<div class="modal-body"><div class="form-grid"><div class="form-field full"><label>Application *</label><select name="jobId" required><option value="">Select a job</option>${state.jobs.filter(j=>j.stage!=='closed').map(j=>`<option value="${j.id}" ${m.jobId===j.id?'selected':''}>${esc(j.role)} · ${esc(j.company)}</option>`).join('')}</select></div>${formField('Interview round *','type','Technical Interview','required placeholder="e.g. Technical Round 2"')}${formField('Interviewer','interviewer','','placeholder="e.g. Engineering Manager"')}${formField('Date *','date','2026-10-17','required type="date"')}${formField('Time *','time','10:00','required type="time"')}<div class="form-field"><label>Duration</label><select name="duration"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option></select></div><div class="form-field"><label>Meeting platform</label><select name="mode">${['Google Meet','Zoom','Microsoft Teams','Phone','In person','Other'].map(v=>`<option>${v}</option>`).join('')}</select></div>${formField('Meeting link','link','','type="url" placeholder="https://..."','full')}</div></div><div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button class="primary-btn" type="submit">${ico('calendar')} Schedule</button></div></form>`}else if(m.type==='manage-stages'){content=`<form id="stage-form">${modalHeader('Customize your pipeline','Rename, reorder, or add hiring stages.')}<div class="modal-body"><div class="notice">Stages that contain applications cannot be removed. Reordering only affects their position on the board.</div><div id="stage-editor" style="margin-top:16px">${state.stages.map(s=>stageEditorRow(s.id,s.name)).join('')}</div><button type="button" class="secondary-btn" style="margin-top:16px" data-action="stage-add">${ico('plus')} Add stage</button></div><div class="modal-footer"><button type="button" class="secondary-btn" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">Save pipeline</button></div></form>`}else if(m.type==='upload-doc'){content=`<form id="document-form">${modalHeader('Add a document','Simulated document entry — nothing is uploaded.')}<div class="modal-body"><div class="form-grid"><div class="form-field full"><label>Choose local file</label><input id="document-file" type="file" accept=".pdf,.doc,.docx,.txt"/><span class="form-hint">Only the filename is used for this mockup.</span></div><div class="form-field full"><label>Or enter a filename *</label><input name="name" required placeholder="e.g. Software Engineer Resume.pdf" /></div><div class="form-field full"><label>Document type</label><select name="type">${['Resume','Cover Letter','Portfolio','Other'].map(v=>`<option>${v}</option>`).join('')}</select></div></div></div><div class="modal-footer"><button class="secondary-btn" type="button" data-action="close-modal">Cancel</button><button type="submit" class="primary-btn">Add document</button></div></form>`}else if(m.type==='doc-info'){const d=state.docs.find(x=>x.id===m.id);if(!d)return '';content=`<div>${modalHeader('Document details',d.name)}<div class="modal-body"><div class="detail-info-grid"><div class="detail-fact"><span>FILE TYPE</span><strong>${esc(d.type)}</strong></div><div class="detail-fact"><span>FILE SIZE</span><strong>${esc(d.size)}</strong></div></div><div class="section-label">ATTACHED TO APPLICATIONS</div>${d.used.length?d.used.map(id=>{const j=getJob(id);return j?`<div class="interview-card"><strong>${esc(j.role)}</strong><p>${esc(j.company)}</p></div>`:''}).join(''):'<p class="text-description">Not assigned yet.</p>'}<p class="notice">This is a filename-only demo. The actual file cannot be opened from this prototype.</p></div><div class="modal-footer"><button class="primary-btn" data-action="close-modal">Done</button></div></div>`}return `<div class="modal-overlay" data-action="outside-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.type)}" onclick="event.stopPropagation()">${content}</div></div>`}
function stageEditorRow(id,name){const count=state.jobs.filter(j=>j.stage===id).length;return `<div class="stage-edit-row" data-stage-edit="${esc(id)}"><span style="color:#b4c1b7;cursor:grab">${ico('columns','ic-sm')}</span><input aria-label="Stage name" data-stage-input value="${esc(name)}" required maxlength="40"/><button type="button" class="icon-btn" title="Move up" data-action="stage-up">↑</button><button type="button" class="icon-btn" title="Move down" data-action="stage-down">↓</button><button type="button" class="icon-btn" title="Remove stage" data-action="stage-remove" ${count?'disabled':''}>${ico('trash','ic-sm')}</button></div>`}
function render(){const prevScroll=window.scrollY;document.getElementById('app').innerHTML=`<div class="app-shell"><div class="sidebar-overlay ${state.sidebarOpen?'show':''}" data-action="close-menu"></div>${renderSidebar()}<div class="page-wrap">${renderTopbar()}<main class="main-content">${state.notice?`<div class="demo-banner">${ico('sparkle','ic-sm')} <span><strong>Interactive design preview</strong> — All jobs, interviews, and documents are sample data. Changes reset on refresh.</span><button data-action="hide-notice">Dismiss</button></div>`:''}${({dashboard:renderDashboard,jobs:renderJobs,pipeline:renderPipeline,calendar:renderCalendar,tasks:renderTasks,analytics:renderAnalytics,documents:renderDocuments,settings:renderSettings}[state.page]||renderDashboard)()}</main></div>${renderDrawer()}${renderModal()}${state.toast?`<div class="toast">${ico('check','ic-sm')} ${esc(state.toast)}</div>`:''}</div>`;window.scrollTo(0,prevScroll)}
function navigate(page){state.page=page;state.sidebarOpen=false;state.notificationOpen=false;state.drawer=null;state.modal=null;state.toast='';window.scrollTo(0,0);render()}
let toastTimer;function toast(s){state.toast=s;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';const el=document.querySelector('.toast');if(el)el.remove()},3000)}
function moveStage(id,stage){const j=getJob(id);if(!j||j.stage===stage)return;const prev=getStage(j.stage).name;j.stage=stage;if(stage==='closed'&&!j.outcome)j.outcome='No response';toast(`${j.company} moved from ${prev} to ${getStage(stage).name}`)}
function exportCSV(){const rows=[['Company','Job Title','Stage','Priority','Minimum Salary','Maximum Salary','Currency','Period','Applied Date','Work Setup','Location','Source'],...state.jobs.map(j=>[j.company,j.role,getStage(j.stage).name,j.priority,j.min,j.max,j.currency,j.unit,j.appliedAt||'',j.work,j.location,j.source])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jobtrack-demo-applications.csv';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);toast('CSV exported successfully')}
let autoId=100;
document.addEventListener('click',e=>{const pageEl=e.target.closest('[data-page]');if(pageEl){navigate(pageEl.dataset.page);return}const jb=e.target.closest('[data-job]');if(jb&&!e.target.closest('[data-toggle-task]')){state.drawer=jb.dataset.job;state.drawerTab='overview';state.notificationOpen=false;render();return}const jt=e.target.closest('[data-jobstab]');if(jt){state.jobsTab=jt.dataset.jobstab;render();return}const db=e.target.closest('[data-drawer-tab]');if(db){state.drawerTab=db.dataset.drawerTab;render();return}const ta=e.target.closest('[data-toggle-task]');if(ta){const t=state.tasks.find(v=>v.id===ta.dataset.toggleTask);if(t){t.completed=!t.completed;toast(t.completed?'Task completed':'Task reopened')}return}const sd=e.target.closest('[data-select-date]');if(sd){state.selectedDate=sd.dataset.selectDate;const d=new Date(state.selectedDate+'T12:00:00');state.calendarMonth=new Date(d.getFullYear(),d.getMonth(),1);render();return}const notif=e.target.closest('[data-toggle-notification]');if(notif){const k=notif.dataset.toggleNotification;state.notifications[k]=!state.notifications[k];render();return}const ac=e.target.closest('[data-action]');if(!ac)return;const action=ac.dataset.action;switch(action){case 'menu':state.sidebarOpen=true;render();break;case 'close-menu':state.sidebarOpen=false;render();break;case 'notifications':state.notificationOpen=!state.notificationOpen;render();break;case 'hide-notice':state.notice=false;render();break;case 'add-job':state.modal={type:'add-job',stage:ac.dataset.newStage||'saved'};render();break;case 'edit-job':state.modal={type:'edit-job',id:ac.dataset.id};render();break;case 'close-modal':state.modal=null;render();break;case 'outside-modal':if(e.target===ac){state.modal=null;render()}break;case 'close-drawer':state.drawer=null;render();break;case 'add-task':state.modal={type:'add-task',jobId:ac.dataset.forJob||state.drawer||''};render();break;case 'new-interview':state.modal={type:'new-interview',jobId:ac.dataset.forJob||state.drawer||''};render();break;case 'manage-stages':state.modal={type:'manage-stages'};render();break;case 'prev-month':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()-1,1);render();break;case 'next-month':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()+1,1);render();break;case 'today':state.calendarMonth=new Date(2026,9,1);state.selectedDate=TODAY;render();break;case 'clear-filters':state.query='';state.stageFilter='all';state.priorityFilter='all';state.jobsTab='all';render();break;case 'export':exportCSV();break;case 'connect-calendar':state.calendarConnected=!state.calendarConnected;toast(state.calendarConnected?'Calendar connection simulated':'Calendar disconnected in demo');break;case 'upload-doc':state.modal={type:'upload-doc'};render();break;case 'document-info':state.modal={type:'doc-info',id:ac.dataset.docId};render();break;case 'stage-add':{const ed=document.getElementById('stage-editor');ed.insertAdjacentHTML('beforeend',stageEditorRow('new-'+(++autoId),''));ed.lastElementChild.querySelector('input').focus();break}case 'stage-up':{const row=ac.closest('[data-stage-edit]');if(row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);break}case 'stage-down':{const row=ac.closest('[data-stage-edit]');if(row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);break}case 'stage-remove':ac.closest('[data-stage-edit]').remove();break;}}
);
document.addEventListener('change',e=>{const el=e.target;if(el.id==='stage-filter'){state.stageFilter=el.value;render()}if(el.id==='priority-filter'){state.priorityFilter=el.value;render()}if(el.id==='drawer-stage'){moveStage(state.drawer,el.value)}if(el.id==='drawer-priority'){const j=getJob(state.drawer);if(j){j.priority=el.value;toast('Priority updated')}}if(el.id==='document-file'){const f=el.files?.[0];const inp=document.querySelector('#document-form [name="name"]');if(f&&inp)inp.value=f.name}});
document.addEventListener('input',e=>{if(e.target.id==='jobs-search'||e.target.id==='global-search'){const id=e.target.id,caret=e.target.selectionStart;state.query=e.target.value;if(id==='global-search'&&state.page!=='jobs')state.page='jobs';render();const next=document.getElementById(id==='global-search'?'global-search':'jobs-search');next?.focus();try{next?.setSelectionRange(caret,caret)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)state.modal=null;else if(state.drawer)state.drawer=null;else if(state.notificationOpen)state.notificationOpen=false;else if(state.sidebarOpen)state.sidebarOpen=false;render()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();document.getElementById('global-search')?.focus()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['job-form','task-form','interview-form','stage-form','document-form'].includes(f.id))return;e.preventDefault();const data=new FormData(f);if(f.id==='job-form'){const curr=state.modal.type==='edit-job'?getJob(state.modal.id):null;let min=Number(data.get('min'))||0,max=Number(data.get('max'))||0;if(max&&min>max){alert('Maximum salary must be equal to or greater than minimum salary.');return}const stage=String(data.get('stage')),appliedAt=String(data.get('appliedAt')||'')||null;const values={role:String(data.get('role')).trim(),company:String(data.get('company')).trim(),min,max,currency:String(data.get('currency')),unit:String(data.get('unit')),stage,priority:String(data.get('priority')),work:String(data.get('work')),location:String(data.get('location')),appliedAt,source:String(data.get('source')),description:String(data.get('description')),notes:String(data.get('notes'))};if(!values.role||!values.company)return;if(curr){Object.assign(curr,values);state.drawer=curr.id}else{const color=['#e4f1e7','#e2edf6','#f1e8f6','#fbeadf'][state.jobs.length%4];const j=makeJob('j'+(++autoId),values.company,values.company.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(),color,values.role,stage,values.priority,values.currency,values.min,values.max,values.unit,values.appliedAt,values.work,values.location,values.source,{description:values.description||'No description entered yet.',notes:values.notes});state.jobs.unshift(j);state.drawer=j.id;state.drawerTab='overview'}state.modal=null;toast(curr?'Opportunity updated':'New opportunity saved');return}
if(f.id==='task-form'){state.tasks.push({id:'t'+(++autoId),title:String(data.get('title')).trim(),due:String(data.get('due')),category:String(data.get('category')),jobId:String(data.get('jobId')),completed:false});state.modal=null;toast('Task added to your list');return}
if(f.id==='interview-form'){if(!data.get('jobId'))return;const interview={id:'i'+(++autoId),jobId:String(data.get('jobId')),type:String(data.get('type')),date:String(data.get('date')),time:String(data.get('time')),duration:Number(data.get('duration')),mode:String(data.get('mode')),interviewer:String(data.get('interviewer')),link:String(data.get('link')),status:'Scheduled'};state.interviews.push(interview);state.modal=null;toast('Interview scheduled');return}
if(f.id==='stage-form'){const editRows=[...f.querySelectorAll('[data-stage-edit]')];const newStages=[];for(const row of editRows){const name=row.querySelector('[data-stage-input]').value.trim();if(!name){alert('Every stage needs a name.');return}const id=row.dataset.stageEdit,old=state.stages.find(s=>s.id===id);newStages.push({id:id.startsWith('new-')?'custom-'+(++autoId):id,name,color:old?.color||['#78ab90','#9d94bb','#bbaa76'][newStages.length%3]})}if(new Set(newStages.map(s=>s.name.toLowerCase())).size!==newStages.length){alert('Stage names must be unique.');return}state.stages=newStages;state.modal=null;toast('Your pipeline is updated');return}
if(f.id==='document-form'){const name=String(data.get('name')).trim();if(!name)return;state.docs.push({id:'d'+(++autoId),name,type:String(data.get('type')),size:'Demo file',date:TODAY,used:[]});state.modal=null;toast('Document added to demo library')}});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-drag-id]');if(!card)return;e.dataTransfer.setData('text/plain',card.dataset.dragId);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop-stage]');if(col){e.preventDefault();col.classList.add('drag-hover')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop-stage]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-hover')});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop-stage]');if(!col)return;e.preventDefault();moveStage(e.dataTransfer.getData('text/plain'),col.dataset.dropStage)});
render();
})();
</script>
</body>
</html>
